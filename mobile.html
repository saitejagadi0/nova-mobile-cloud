<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#05070c">

    <link rel="manifest" href="/manifest.json">

    <title>NOVA Personal AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #05070c;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at top,
                    #101a2e 0%,
                    #05070c 45%,
                    #020306 100%
                );
        }

        /* HEADER */

        .header {
            flex-shrink: 0;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(5,7,12,0.88);
            backdrop-filter: blur(15px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #315cff,
                    #7c3cff
                );
            box-shadow:
                0 0 25px rgba(75,90,255,0.45);
            font-weight: 900;
            font-size: 20px;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 21px;
            letter-spacing: 1px;
        }

        .brand-text span {
            font-size: 11px;
            color: #8c96aa;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #9ca7ba;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #777;
        }

        .status-dot.online {
            background: #35e889;
            box-shadow: 0 0 10px rgba(53,232,137,0.8);
        }

        .status-dot.offline {
            background: #ff4f65;
        }

        /* MODES */

        .modes {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(5,7,12,0.7);
        }

        .modes::-webkit-scrollbar {
            display: none;
        }

        .mode-btn {
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.09);
            background: rgba(255,255,255,0.04);
            color: #b9c1d1;
            padding: 9px 13px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn.active {
            color: #ffffff;
            background: rgba(72,91,255,0.25);
            border-color: rgba(100,120,255,0.65);
            box-shadow:
                0 0 15px rgba(72,91,255,0.15);
        }

        .mode-btn:active {
            transform: scale(0.96);
        }

        /* CHAT */

        .chat {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px 14px 25px;
            scroll-behavior: smooth;
        }

        .welcome {
            text-align: center;
            padding: 45px 20px 25px;
            color: #9ba5b8;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            background:
                linear-gradient(
                    135deg,
                    #315cff,
                    #7c3cff
                );
            box-shadow:
                0 0 40px rgba(75,90,255,0.35);
        }

        .welcome h2 {
            margin: 0 0 8px;
            color: white;
            font-size: 25px;
        }

        .welcome p {
            margin: 0;
            line-height: 1.6;
            font-size: 14px;
        }

        .message {
            display: flex;
            margin-bottom: 14px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 88%;
            padding: 12px 14px;
            border-radius: 17px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background:
                linear-gradient(
                    135deg,
                    #315cff,
                    #4b3cff
                );
            border-bottom-right-radius: 5px;
            box-shadow:
                0 5px 20px rgba(49,92,255,0.2);
        }

        .message.assistant .bubble {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.07);
            border-bottom-left-radius: 5px;
            color: #e8ebf2;
        }

        /* BOTTOM */

        .bottom {
            flex-shrink: 0;
            padding: 10px 12px 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(5,7,12,0.94);
            backdrop-filter: blur(18px);
        }

        .tools {
            display: flex;
            gap: 8px;
            margin-bottom: 9px;
        }

        .small-btn {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #aeb7c8;
            border-radius: 11px;
            padding: 8px 7px;
            font-size: 12px;
            cursor: pointer;
        }

        .small-btn:active {
            transform: scale(0.97);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            height: 48px;
            padding: 0 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            outline: none;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 15px;
        }

        #messageInput::placeholder {
            color: #737e91;
        }

        #messageInput:focus {
            border-color: rgba(91,110,255,0.7);
            box-shadow:
                0 0 15px rgba(72,91,255,0.12);
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border: 0;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            background: rgba(255,255,255,0.08);
            font-size: 19px;
        }

        .send-btn {
            background:
                linear-gradient(
                    135deg,
                    #315cff,
                    #703cff
                );
            box-shadow:
                0 5px 18px rgba(49,92,255,0.3);
        }

        .mic-btn.listening {
            background: #d93452;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(217,52,82,0.5);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(217,52,82,0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(217,52,82,0);
            }
        }

        /* TYPING */

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #9ca7ba;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* DESKTOP */

        @media (min-width: 700px) {

            .chat {
                padding-left: 15%;
                padding-right: 15%;
            }

            .bottom {
                padding-left: 15%;
                padding-right: 15%;
            }

            .bubble {
                max-width: 75%;
            }

            .modes {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                N
            </div>

            <div class="brand-text">

                <h1>NOVA</h1>

                <span>
                    Personal AI Assistant
                </span>

            </div>

        </div>

        <div class="status">

            <div
                id="statusDot"
                class="status-dot"
            ></div>

            <span id="statusText">
                Connecting...
            </span>

        </div>

    </header>


    <!-- MODES -->

    <div class="modes">

        <button
            class="mode-btn active"
            data-mode="chat"
            onclick="setMode('chat')"
        >
            💬 Chat
        </button>

        <button
            class="mode-btn"
            data-mode="reason"
            onclick="setMode('reason')"
        >
            🧠 Reason
        </button>

        <button
            class="mode-btn"
            data-mode="code"
            onclick="setMode('code')"
        >
            💻 Code
        </button>

        <button
            class="mode-btn"
            data-mode="math"
            onclick="setMode('math')"
        >
            🧮 Math
        </button>

    </div>


    <!-- CHAT -->

    <main
        id="chat"
        class="chat"
    >

        <div
            id="welcome"
            class="welcome"
        >

            <div class="welcome-logo">
                N
            </div>

            <h2>
                Hello, I'm NOVA
            </h2>

            <p>
                Your personal AI assistant.<br>
                Ask me anything.
            </p>

        </div>

    </main>


    <!-- BOTTOM -->

    <section class="bottom">

        <div class="tools">

            <button
                class="small-btn"
                onclick="clearNovaMemory()"
            >
                🧹 Clear Memory
            </button>

            <button
                class="small-btn"
                onclick="testConnection()"
            >
                🔄 Connection
            </button>

        </div>


        <div class="input-row">

            <button
                id="micButton"
                class="icon-btn mic-btn"
                onclick="toggleVoice()"
                title="Voice"
            >
                🎙️
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="Talk to NOVA..."
                autocomplete="off"
                enterkeyhint="send"
            >

            <button
                class="icon-btn send-btn"
                onclick="sendMessage()"
                title="Send"
            >
                ➤
            </button>

        </div>

    </section>

</div>


<script>

    /* =========================================================
       NOVA CONFIG
       ========================================================= */

    const NOVA_API =
        "https://nova-mobile-cloud-2-production.up.railway.app";

    const MEMORY_KEY =
        "nova_chat_history";

    let currentMode = "chat";

    let recognition = null;

    let isListening = false;


    /* =========================================================
       MEMORY
       ========================================================= */

    function getMemory() {

        try {

            const saved =
                localStorage.getItem(MEMORY_KEY);

            if (!saved) {
                return [];
            }

            const history =
                JSON.parse(saved);

            if (!Array.isArray(history)) {
                return [];
            }

            return history.slice(-20);

        } catch (error) {

            console.error(
                "Memory load error:",
                error
            );

            return [];
        }
    }


    function saveMemory(history) {

        try {

            history =
                history.slice(-20);

            localStorage.setItem(
                MEMORY_KEY,
                JSON.stringify(history)
            );

        } catch (error) {

            console.error(
                "Memory save error:",
                error
            );
        }
    }


    function clearNovaMemory() {

        localStorage.removeItem(
            MEMORY_KEY
        );

        const chat =
            document.getElementById("chat");

        chat.innerHTML = "";

        const welcome =
            document.createElement("div");

        welcome.className =
            "welcome";

        welcome.innerHTML = `
            <div class="welcome-logo">N</div>
            <h2>Hello, I'm NOVA</h2>
            <p>
                Memory cleared.<br>
                Start a new conversation.
            </p>
        `;

        chat.appendChild(welcome);

        console.log(
            "NOVA memory cleared"
        );
    }


    /* =========================================================
       CHAT DISPLAY
       ========================================================= */

    function addMessage(
        role,
        text
    ) {

        const welcome =
            document.getElementById(
                "welcome"
            );

        if (welcome) {
            welcome.remove();
        }

        const chat =
            document.getElementById(
                "chat"
            );

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message " + role;

        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";

        bubble.textContent =
            text;

        message.appendChild(
            bubble
        );

        chat.appendChild(
            message
        );

        scrollChat();
    }


    function showTyping() {

        const chat =
            document.getElementById(
                "chat"
            );

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message assistant";

        message.id =
            "typingMessage";

        message.innerHTML = `
            <div class="bubble">
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;

        chat.appendChild(
            message
        );

        scrollChat();
    }


    function removeTyping() {

        const typing =
            document.getElementById(
                "typingMessage"
            );

        if (typing) {
            typing.remove();
        }
    }


    function scrollChat() {

        const chat =
            document.getElementById(
                "chat"
            );

        chat.scrollTop =
            chat.scrollHeight;
    }


    /* =========================================================
       MODES
       ========================================================= */

    function setMode(mode) {

        currentMode =
            mode;

        const buttons =
            document.querySelectorAll(
                ".mode-btn"
            );

        buttons.forEach(
            function(button) {

                button.classList.remove(
                    "active"
                );

                if (
                    button.dataset.mode ===
                    mode
                ) {

                    button.classList.add(
                        "active"
                    );
                }

            }
        );

        const input =
            document.getElementById(
                "messageInput"
            );

        const placeholders = {

            chat:
                "Talk to NOVA...",

            reason:
                "Ask NOVA to reason...",

            code:
                "Ask NOVA about code...",

            math:
                "Enter a calculation..."

        };

        input.placeholder =
            placeholders[mode] ||
            placeholders.chat;
    }


    /* =========================================================
       SEND MESSAGE
       ========================================================= */

    async function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );

        const message =
            input.value.trim();

        if (!message) {
            return;
        }

        input.value = "";

        let history =
            getMemory();

        addMessage(
            "user",
            message
        );

        showTyping();

        try {

            const response =
                await fetch(
                    NOVA_API + "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                mode:
                                    currentMode,

                                history:
                                    history

                            })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP " +
                    response.status
                );
            }


            const data =
                await response.json();


            removeTyping();


            if (!data.success) {

                addMessage(
                    "assistant",
                    "NOVA error: " +
                    (
                        data.error ||
                        "Unknown server error."
                    )
                );

                return;
            }


            const answer =
                data.response ||
                "I didn't receive a response.";


            addMessage(
                "assistant",
                answer
            );


            /* SAVE CONVERSATION */

            history.push({

                role:
                    "user",

                content:
                    message

            });


            history.push({

                role:
                    "assistant",

                content:
                    answer

            });


            saveMemory(
                history
            );


            speak(
                answer
            );


        } catch (error) {

            removeTyping();

            console.error(
                "NOVA request error:",
                error
            );

            addMessage(
                "assistant",
                "Connection error: " +
                error.message
            );
        }
    }


    /* =========================================================
       ENTER KEY
       ========================================================= */

    document
        .getElementById(
            "messageInput"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    sendMessage();
                }

            }
        );


    /* =========================================================
       CONNECTION
       ========================================================= */

    async function testConnection() {

        const dot =
            document.getElementById(
                "statusDot"
            );

        const text =
            document.getElementById(
                "statusText"
            );

        text.textContent =
            "Connecting...";

        dot.className =
            "status-dot";


        try {

            const response =
                await fetch(
                    NOVA_API +
                    "/health",
                    {
                        method: "GET"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            const data =
                await response.json();


            if (
                data.status ===
                "online"
            ) {

                dot.className =
                    "status-dot online";

                text.textContent =
                    "NOVA Online";

            } else {

                throw new Error(
                    "NOVA offline"
                );
            }


        } catch (error) {

            dot.className =
                "status-dot offline";

            text.textContent =
                "Offline";

            console.error(
                "Connection error:",
                error
            );
        }
    }


    /* =========================================================
       TEXT TO SPEECH
       ========================================================= */

    function speak(text) {

        if (
            !("speechSynthesis" in window)
        ) {
            return;
        }

        try {

            window.speechSynthesis.cancel();

            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );

            utterance.rate =
                1.0;

            utterance.pitch =
                1.0;

            utterance.volume =
                1.0;

            window.speechSynthesis.speak(
                utterance
            );

        } catch (error) {

            console.error(
                "Speech error:",
                error
            );
        }
    }


    /* =========================================================
       VOICE INPUT
       ========================================================= */

    function setupVoice() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            console.log(
                "Speech recognition unavailable."
            );

            return;
        }


        recognition =
            new SpeechRecognition();


        recognition.continuous =
            false;

        recognition.interimResults =
            false;

        recognition.lang =
            "en-US";


        recognition.onstart =
            function() {

                isListening =
                    true;

                const button =
                    document.getElementById(
                        "micButton"
                    );

                button.classList.add(
                    "listening"
                );

                button.textContent =
                    "🔴";
            };


        recognition.onresult =
            function(event) {

                const transcript =
                    event.results[0][0]
                        .transcript;


                const input =
                    document.getElementById(
                        "messageInput"
                    );


                input.value =
                    transcript;


                sendMessage();
            };


        recognition.onerror =
            function(event) {

                console.error(
                    "Voice recognition:",
                    event.error
                );
            };


        recognition.onend =
            function() {

                isListening =
                    false;

                const button =
                    document.getElementById(
                        "micButton"
                    );

                button.classList.remove(
                    "listening"
                );

                button.textContent =
                    "🎙️";
            };
    }


    function toggleVoice() {

        if (!recognition) {

            alert(
                "Voice input is not supported by this browser."
            );

            return;
        }


        if (isListening) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                console.error(
                    "Voice start error:",
                    error
                );
            }
        }
    }


    /* =========================================================
       LOAD OLD MEMORY INTO SCREEN
       ========================================================= */

    function loadConversation() {

        const history =
            getMemory();

        if (
            history.length === 0
        ) {
            return;
        }


        const chat =
            document.getElementById(
                "chat"
            );


        const welcome =
            document.getElementById(
                "welcome"
            );


        if (welcome) {
            welcome.remove();
        }


        history.forEach(
            function(item) {

                if (
                    item.role ===
                    "user"
                ) {

                    addMessage(
                        "user",
                        item.content
                    );

                } else if (
                    item.role ===
                    "assistant"
                ) {

                    addMessage(
                        "assistant",
                        item.content
                    );
                }

            }
        );


        scrollChat();
    }


    /* =========================================================
       START NOVA
       ========================================================= */

    window.addEventListener(
        "load",
        function() {

            setupVoice();

            loadConversation();

            testConnection();

        }
    );

</script>

</body>
</html>
