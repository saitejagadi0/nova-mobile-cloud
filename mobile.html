<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>NOVA Mobile</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070c">
<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    :root {
        --bg: #05070c;
        --panel: #0b0f17;
        --panel2: #111722;
        --border: #202938;
        --text: #f4f7fb;
        --muted: #8d99aa;
        --accent: #4da3ff;
        --accent2: #7c5cff;
        --user: #163a5c;
        --nova: #111925;
        --danger: #ff5d73;
        --success: #36d399;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
    }

    button,
    input,
    textarea {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .app {
        width: 100%;
        max-width: 720px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(
                circle at 50% -10%,
                rgba(77,163,255,0.13),
                transparent 35%
            ),
            var(--bg);
    }

    /* HEADER */

    .header {
        flex-shrink: 0;
        height: 72px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: rgba(5,7,12,0.94);
        backdrop-filter: blur(14px);
        position: relative;
        z-index: 5;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 11px;
    }

    .logo {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 800;
        background:
            linear-gradient(
                135deg,
                var(--accent),
                var(--accent2)
            );
        box-shadow:
            0 0 24px rgba(77,163,255,0.24);
    }

    .brand-text {
        display: flex;
        flex-direction: column;
    }

    .brand-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.8px;
    }

    .brand-subtitle {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
    }

    .connection {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255,255,255,0.025);
        font-size: 11px;
        color: var(--muted);
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 10px rgba(255,93,115,0.5);
    }

    .dot.online {
        background: var(--success);
        box-shadow: 0 0 10px rgba(54,211,153,0.5);
    }

    /* MODE BAR */

    .mode-bar {
        flex-shrink: 0;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
        background: rgba(8,11,17,0.96);
    }

    .mode-bar::-webkit-scrollbar {
        display: none;
    }

    .mode-btn {
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        border-radius: 12px;
        padding: 9px 13px;
        font-size: 12px;
        font-weight: 700;
        transition: 0.18s ease;
    }

    .mode-btn.active {
        color: white;
        border-color: rgba(77,163,255,0.65);
        background: rgba(77,163,255,0.13);
        box-shadow: 0 0 18px rgba(77,163,255,0.08);
    }

    /* CHAT */

    .chat {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 18px 14px 16px;
        scroll-behavior: smooth;
    }

    .welcome {
        margin: 20px auto 28px;
        text-align: center;
        max-width: 470px;
    }

    .welcome-orb {
        width: 74px;
        height: 74px;
        margin: 0 auto 15px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 31px;
        font-weight: 900;
        background:
            linear-gradient(
                135deg,
                rgba(77,163,255,0.95),
                rgba(124,92,255,0.95)
            );
        box-shadow:
            0 0 42px rgba(77,163,255,0.22);
    }

    .welcome h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.7px;
    }

    .welcome p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
    }

    .message-row {
        display: flex;
        margin: 10px 0;
        width: 100%;
    }

    .message-row.user {
        justify-content: flex-end;
    }

    .message-row.nova {
        justify-content: flex-start;
    }

    .message {
        max-width: 88%;
        padding: 12px 14px;
        border-radius: 17px;
        line-height: 1.48;
        font-size: 14px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid var(--border);
    }

    .message.user {
        background: var(--user);
        border-color: rgba(77,163,255,0.22);
        border-bottom-right-radius: 5px;
    }

    .message.nova {
        background: var(--nova);
        border-bottom-left-radius: 5px;
    }

    .message-label {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 5px;
        font-weight: 800;
        letter-spacing: 0.6px;
        text-transform: uppercase;
    }

    .typing {
        display: inline-flex;
        gap: 4px;
        padding: 5px 2px;
    }

    .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
        animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes blink {
        0%, 80%, 100% {
            opacity: 0.25;
        }

        40% {
            opacity: 1;
        }
    }

    /* QUICK ACTIONS */

    .quick-section {
        flex-shrink: 0;
        padding: 8px 14px 6px;
        border-top: 1px solid var(--border);
        background: rgba(7,10,15,0.96);
    }

    .quick-title {
        font-size: 10px;
        color: var(--muted);
        margin: 0 0 7px 2px;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 0.7px;
    }

    .quick-actions {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        scrollbar-width: none;
    }

    .quick-actions::-webkit-scrollbar {
        display: none;
    }

    .quick-btn {
        flex-shrink: 0;
        padding: 8px 11px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        font-size: 11px;
    }

    .quick-btn:active,
    .mode-btn:active,
    .send-btn:active,
    .mic-btn:active {
        transform: scale(0.96);
    }

    /* INPUT */

    .composer {
        flex-shrink: 0;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 10px 12px 12px;
        background: rgba(5,7,12,0.98);
    }

    .input-wrap {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: flex-end;
        border: 1px solid var(--border);
        border-radius: 17px;
        background: var(--panel);
        overflow: hidden;
    }

    #messageInput {
        flex: 1;
        min-width: 0;
        max-height: 120px;
        min-height: 46px;
        resize: none;
        border: 0;
        outline: none;
        padding: 13px 12px;
        color: var(--text);
        background: transparent;
        font-size: 14px;
        line-height: 1.4;
    }

    #messageInput::placeholder {
        color: #697487;
    }

    .mic-btn,
    .send-btn {
        width: 46px;
        height: 46px;
        flex-shrink: 0;
        border-radius: 15px;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }

    .mic-btn {
        background: var(--panel);
        color: white;
    }

    .mic-btn.listening {
        background: rgba(255,93,115,0.16);
        border-color: rgba(255,93,115,0.55);
        animation: pulse 1s infinite;
    }

    .send-btn {
        background:
            linear-gradient(
                135deg,
                var(--accent),
                var(--accent2)
            );
        color: white;
        border: 0;
        font-size: 19px;
    }

    @keyframes pulse {
        0% {
            box-shadow: 0 0 0 0 rgba(255,93,115,0.35);
        }
        70% {
            box-shadow: 0 0 0 10px rgba(255,93,115,0);
        }
        100% {
            box-shadow: 0 0 0 0 rgba(255,93,115,0);
        }
    }

    /* STATUS */

    .status-line {
        flex-shrink: 0;
        text-align: center;
        min-height: 18px;
        padding: 0 12px 6px;
        color: var(--muted);
        font-size: 10px;
        background: rgba(5,7,12,0.98);
    }

    /* DESKTOP */

    @media (min-width: 721px) {
        body {
            padding: 10px;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    #111a2b,
                    #03050a 55%
                );
        }

        .app {
            height: calc(100dvh - 20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        }
    }
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            <div class="logo">N</div>

            <div class="brand-text">
                <div class="brand-title">NOVA</div>
                <div class="brand-subtitle">
                    Personal AI Assistant
                </div>
            </div>
        </div>

        <div class="connection">
            <span class="dot" id="connectionDot"></span>
            <span id="connectionText">Connecting...</span>
        </div>

    </header>

    <!-- MODES -->

    <div class="mode-bar">

        <button class="mode-btn active" data-mode="chat">
            💬 Chat
        </button>

        <button class="mode-btn" data-mode="reason">
            🧠 Reason
        </button>

        <button class="mode-btn" data-mode="code">
            💻 Code
        </button>

        <button class="mode-btn" data-mode="math">
            🧮 Math
        </button>

    </div>

    <!-- CHAT -->

    <main class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-orb">
                N
            </div>

            <h1>How can I help?</h1>

            <p>
                NOVA cloud is ready. Ask a question, solve a problem,
                write code, or use your voice.
            </p>

        </div>

    </main>

    <!-- QUICK ACTIONS -->

    <section class="quick-section">

        <div class="quick-title">
            Quick actions
        </div>

        <div class="quick-actions">

            <button class="quick-btn" onclick="openSite('https://www.google.com')">
                🔎 Google
            </button>

            <button class="quick-btn" onclick="openSite('https://www.youtube.com')">
                ▶️ YouTube
            </button>

            <button class="quick-btn" onclick="openSite('https://www.instagram.com')">
                📷 Instagram
            </button>

            <button class="quick-btn" onclick="openSite('https://www.facebook.com')">
                👥 Facebook
            </button>

            <button class="quick-btn" onclick="openSite('https://maps.google.com')">
                🗺 Maps
            </button>

            <button class="quick-btn" onclick="openSite('https://mail.google.com')">
                ✉️ Gmail
            </button>

            <button class="quick-btn" onclick="openSite('https://web.whatsapp.com')">
                💬 WhatsApp
            </button>

            <button class="quick-btn" onclick="openSite('https://github.com')">
                🐙 GitHub
            </button>

        </div>

    </section>

    <!-- STATUS -->

    <div class="status-line" id="statusLine">
        Ready
    </div>

    <!-- COMPOSER -->

    <form class="composer" id="composer">

        <div class="input-wrap">

            <textarea
                id="messageInput"
                rows="1"
                autocomplete="off"
                autocorrect="on"
                spellcheck="true"
                placeholder="Ask NOVA anything..."
            ></textarea>

        </div>

        <button
            type="button"
            class="mic-btn"
            id="micButton"
            aria-label="Voice input"
        >
            🎙️
        </button>

        <button
            type="submit"
            class="send-btn"
            id="sendButton"
            aria-label="Send"
        >
            ➤
        </button>

    </form>

</div>

<script>
/* =========================================================
   NOVA MOBILE CONFIG
   ========================================================= */

const NOVA_API = "https://nova-mobile-cloud-2.onrender.com";

let currentMode = localStorage.getItem("nova_mode") || "chat";

let isSending = false;
let recognition = null;
let isListening = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

const input = document.getElementById("messageInput");
const composer = document.getElementById("composer");

const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");

const connectionDot = document.getElementById("connectionDot");
const connectionText = document.getElementById("connectionText");

const statusLine = document.getElementById("statusLine");

const modeButtons =
    document.querySelectorAll(".mode-btn");


/* =========================================================
   MODE
   ========================================================= */

function setMode(mode) {

    currentMode = mode;

    localStorage.setItem("nova_mode", mode);

    modeButtons.forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.mode === mode
        );

    });

    const labels = {
        chat: "Chat",
        reason: "Reasoning",
        code: "Coding",
        math: "Math"
    };

    input.placeholder =
        "Ask NOVA in " +
        (labels[mode] || "Chat") +
        " mode...";

    setStatus(
        "Mode: " +
        (labels[mode] || mode)
    );
}

modeButtons.forEach(button => {

    button.addEventListener("click", () => {

        setMode(button.dataset.mode);

    });

});

setMode(currentMode);


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {
    statusLine.textContent = text;
}


/* =========================================================
   CONNECTION
   ========================================================= */

async function checkConnection() {

    connectionText.textContent = "Connecting...";
    connectionDot.classList.remove("online");

    try {

        const response = await fetch(
            NOVA_API + "/health",
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Server unavailable");
        }

        const data = await response.json();

        if (data.status === "online") {

            connectionText.textContent = "Online";
            connectionDot.classList.add("online");

        } else {

            connectionText.textContent = "Offline";

        }

    } catch (error) {

        connectionText.textContent = "Offline";
        connectionDot.classList.remove("online");

    }

}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(role, text) {

    if (welcome) {
        welcome.remove();
    }

    const row = document.createElement("div");

    row.className =
        "message-row " +
        (role === "user" ? "user" : "nova");

    const message = document.createElement("div");

    message.className =
        "message " +
        (role === "user" ? "user" : "nova");

    const label = document.createElement("span");

    label.className = "message-label";

    label.textContent =
        role === "user"
            ? "You"
            : "NOVA";

    message.appendChild(label);

    const content =
        document.createElement("div");

    content.textContent = text;

    message.appendChild(content);

    row.appendChild(message);

    chat.appendChild(row);

    scrollChat();

    return row;
}


/* =========================================================
   TYPING
   ========================================================= */

function showTyping() {

    if (welcome) {
        welcome.remove();
    }

    const row = document.createElement("div");

    row.className = "message-row nova";
    row.id = "typingRow";

    const message =
        document.createElement("div");

    message.className = "message nova";

    const label =
        document.createElement("span");

    label.className = "message-label";
    label.textContent = "NOVA";

    message.appendChild(label);

    const typing =
        document.createElement("div");

    typing.className = "typing";

    typing.innerHTML =
        "<span></span><span></span><span></span>";

    message.appendChild(typing);

    row.appendChild(message);

    chat.appendChild(row);

    scrollChat();

}

function hideTyping() {

    const row =
        document.getElementById("typingRow");

    if (row) {
        row.remove();
    }

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollChat() {

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });

}


/* =========================================================
   SEND TO RENDER
   ========================================================= */

async function sendMessage(text) {

    text = text.trim();

    if (!text || isSending) {
        return;
    }

    isSending = true;

    sendButton.disabled = true;
    micButton.disabled = true;

    addMessage("user", text);

    input.value = "";
    resizeInput();

    showTyping();

    setStatus("NOVA is thinking...");

    try {

        const response = await fetch(
            NOVA_API + "/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    message: text,
                    mode: currentMode
                })
            }
        );

        const data = await response.json();

        hideTyping();

        if (!response.ok || !data.success) {

            const errorText =
                data.error ||
                "NOVA could not complete the request.";

            addMessage(
                "nova",
                "Sorry bro — " + errorText
            );

            setStatus("Request failed");

            return;
        }

        const answer =
            data.response ||
            "I received the request but got no response.";

        addMessage(
            "nova",
            answer
        );

        setStatus("Ready");

        speak(answer);

    } catch (error) {

        hideTyping();

        addMessage(
            "nova",
            "I couldn't reach the NOVA cloud server. Check your internet connection."
        );

        setStatus("Connection error");

    } finally {

        isSending = false;

        sendButton.disabled = false;
        micButton.disabled = false;

        input.focus();

    }

}


/* =========================================================
   FORM
   ========================================================= */

composer.addEventListener(
    "submit",
    event => {

        event.preventDefault();

        sendMessage(input.value);

    }
);


/* =========================================================
   ENTER KEY
   ========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage(input.value);

        }

    }
);


/* =========================================================
   AUTO RESIZE
   ========================================================= */

function resizeInput() {

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            120
        ) + "px";

}

input.addEventListener(
    "input",
    resizeInput
);


/* =========================================================
   TEXT TO SPEECH
   ========================================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    try {

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.volume = 1;

        window.speechSynthesis.speak(
            utterance
        );

    } catch (error) {

        console.log(
            "Speech error:",
            error
        );

    }

}


/* =========================================================
   VOICE RECOGNITION
   ========================================================= */

function setupVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        micButton.title =
            "Voice recognition is not supported by this browser.";

        return;

    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.maxAlternatives = 1;


    recognition.onstart = () => {

        isListening = true;

        micButton.classList.add(
            "listening"
        );

        micButton.textContent = "⏹️";

        setStatus(
            "Listening..."
        );

    };


    recognition.onresult = event => {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            transcript +=
                event.results[i][0].transcript;

        }

        input.value = transcript;

        resizeInput();

    };


    recognition.onerror = event => {

        console.log(
            "Voice recognition error:",
            event.error
        );

        setStatus(
            "Voice error: " +
            event.error
        );

    };


    recognition.onend = () => {

        isListening = false;

        micButton.classList.remove(
            "listening"
        );

        micButton.textContent = "🎙️";

        const text =
            input.value.trim();

        if (text) {

            sendMessage(text);

        } else {

            setStatus("Ready");

        }

    };

}

micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            alert(
                "Voice recognition is not supported in this browser."
            );

            return;

        }

        if (isListening) {

            recognition.stop();

            return;

        }

        try {

            input.value = "";

            recognition.start();

        } catch (error) {

            console.log(
                "Could not start voice:",
                error
            );

        }

    }
);


/* =========================================================
   OPEN PHONE WEBSITES
   ========================================================= */

function openSite(url) {

    window.location.href = url;

}


/* =========================================================
   STARTUP
   ========================================================= */

setupVoice();

checkConnection();

setInterval(
    checkConnection,
    30000
);

input.focus();

</script>

</body>
</html>
